<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明信片所穿越的空间</title>
    <style>
        /* 💡 1. 引入你的自定义字体 */
        @font-face {
            font-family: 'CachetForWeb';
            src: url('../assets/fonts/Cachetforweb-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'CachetForWeb', "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        
        .city-label {
            background: transparent; 
            border: none;
            position: relative; 
            cursor: pointer;
        }
        
        .city-label img {
            height: 30px; 
            display: block;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.8)); 
        }

        .city-label .zh-name {
            display: none;
            position: absolute;
            top: 100%; 
            left: 50%;
            transform: translateX(-50%); 
            color: #fff;
            font-size: 14px;
            white-space: nowrap;
            margin-top: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
            pointer-events: none; 
        }

        .city-label:hover .zh-name {
            display: block;
        }

        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 12px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
            text-transform: uppercase;
        }

        /* 💡 2. 瑞士风格的左侧边栏布局 */
        #sidebar {
            position: absolute;
            left: 40px; 
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 5px; 
            z-index: 100;
            align-items: flex-start; /* 💡 修改点：增加这一行，让每个按钮宽度贴合自身英文单词 */
        }

        /* 💡 3. 纯文本 UI 设计 (Typography as UI) */
        .theme-btn {
            background: transparent;
            color: rgba(255, 255, 255, 0.4); 
            border: none;
            padding: 8px 0;
            cursor: pointer;
            font-family: inherit; 
            font-size: 30px;
            text-align: left;
            text-transform: lowercase; 
            letter-spacing: 0.5px;
            transition: color 0.1s ease, padding-left 0.2s ease; 
            position: relative;
        }

        .theme-btn:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .theme-btn.active {
            color: #fff;
            padding-left: 15px; 
        }

        .theme-btn.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 1px;
            background-color: #fff;
        }

        /* 💡 修改点：新增侧边栏按钮悬停出现的中文标签样式 */
        /* 采用与 .city-label .zh-name 完全相同的字号、颜色、无背景和阴影格式 */
.theme-btn .zh-name {
    display: none;
    position: absolute;
    top: 50px;          
    left: 50%;                    /* 【修改点 1】设为 50% 开始居中定位 */
    transform: translateX(-50%);  /* 【修改点 1】向左反向平移自身的一半，实现横向居中 */
    color: #fff;
    font-size: 14px;    
    white-space: nowrap;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
    pointer-events: none;
    text-transform: none; 
}

        .theme-btn:hover .zh-name {
            display: block;
        }
    </style>
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
    <script src="../js/postcardsdata.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/screensaver.js"></script>
    <div id="info"></div>

    <div id="sidebar">
        <button class="theme-btn active" onclick="changeTheme('images/garden.JPG', this)">garden<span class="zh-name">花园</span></button>
        <button class="theme-btn" onclick="changeTheme('images/earth.JPG', this)">earth<span class="zh-name">地球</span></button>
        <button class="theme-btn" onclick="changeTheme('images/sea.JPG', this)">sea<span class="zh-name">海洋</span></button>
        <button class="theme-btn" onclick="changeTheme('images/jazz.JPG', this)">jazz<span class="zh-name">爵士</span></button>
        <button class="theme-btn" onclick="changeTheme('images/plaza.JPG', this)">plaza<span class="zh-name">广场</span></button>
        <button class="theme-btn" onclick="changeTheme('images/peace.JPG', this)">peace<span class="zh-name">和平</span></button>
        <button class="theme-btn" onclick="changeTheme('images/beach.JPG', this)">beach<span class="zh-name">海滩</span></button>
        <button class="theme-btn" onclick="changeTheme('images/snow.JPG', this)">snow<span class="zh-name">冰雪</span></button>
        <button class="theme-btn" onclick="changeTheme('images/rural.JPG', this)">rural<span class="zh-name">乡村</span></button>
        <button class="theme-btn" onclick="changeTheme('images/glass.JPG', this)">glass<span class="zh-name">玻璃</span></button>
        <button class="theme-btn" onclick="changeTheme('images/dream.JPG', this)">dream<span class="zh-name">梦</span></button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>
        let camera, scene, renderer, labelRenderer, controls;
        let sphere, textureLoader;
        const sphereRadius = 50;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 150);

            const geometry = new THREE.SphereGeometry(sphereRadius, 64, 64); 
            
            textureLoader = new THREE.TextureLoader();
            const texture = textureLoader.load('images/garden.JPG'); 
            const material = new THREE.MeshBasicMaterial({ map: texture });
            
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            document.body.appendChild(labelRenderer.domElement);

            controls = new THREE.OrbitControls(camera, labelRenderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 55;  
            controls.maxDistance = 400;

            controls.autoRotate = true;     
            controls.autoRotateSpeed = 0.5; 

            // 加载全部国家
            addLabel('nations/usa.png', 38, -97, '美国');
            addLabel('nations/canada.png', 56, -106, '加拿大');
            addLabel('nations/brazil.png', -14, -52, '巴西');
            addLabel('nations/japan.png', 36, 138, '日本');
            addLabel('nations/korea.png', 36, 128, '韩国'); 
            addLabel('nations/india.png', 21, 79, '印度');
            addLabel('nations/singapore.png', 1.3, 104, '新加坡');
            addLabel('nations/uae.png', 23, 54, '阿联酋');
            addLabel('nations/uzbekistan.png', 41, 65, '乌兹别克斯坦');
            addLabel('nations/british.png', 55, -3, '英国'); 
            addLabel('nations/ireland.png', 53, -8, '爱尔兰');
            addLabel('nations/france.png', 46, 2, '法国');
            addLabel('nations/germany.png', 51, 10, '德国');
            addLabel('nations/italy.png', 42, 13, '意大利');
            addLabel('nations/spain.png', 40, -4, '西班牙');
            addLabel('nations/netherlands.png', 52, 5, '荷兰');
            addLabel('nations/switzerland.png', 47, 8, '瑞士');
            addLabel('nations/austria.png', 48, 14, '奥地利');
            addLabel('nations/czech.png', 50, 15, '捷克'); 
            addLabel('nations/slovakia.png', 49, 20, '斯洛伐克');
            addLabel('nations/poland.png', 52, 19, '波兰');
            addLabel('nations/finland.png', 62, 26, '芬兰');
            addLabel('nations/belarus.png', 54, 28, '白俄罗斯');
            addLabel('nations/ukraine.png', 48, 31, '乌克兰');
            addLabel('nations/slovenia.png', 46, 15, '斯洛文尼亚');
            addLabel('nations/croatia.png', 45, 15.5, '克罗地亚');
            addLabel('nations/serbia.png', 44, 21, '塞尔维亚');
            addLabel('nations/macedonia.png', 42, 22, '北马其顿');
            addLabel('nations/lithuania.png', 55, 24, '立陶宛');
            addLabel('nations/egypt.png', 27, 31, '埃及');
            addLabel('nations/morocco.png', 32, -7, '摩洛哥');
            addLabel('nations/russia.png', 60, 90, '俄罗斯');    
            addLabel('nations/siberia.png', 65, 110, '西伯利亚');  
            addLabel('nations/china.png', 35, 105, '中国');
            addLabel('nations/indonesia.png', -2, 114, '印度尼西亚');
            addLabel('nations/malaysia.png', 4, 109, '马来西亚');
            addLabel('nations/filipino.png', 13, 122, '菲律宾');   
            addLabel('nations/new zealand.png', -41, 174, '新西兰'); 
            addLabel('nations/algeria.png', 28, 1.6, '阿尔及利亚');    
            addLabel('nations/georgia.png', 42, 43.5, '格鲁吉亚');   
            addLabel('nations/cyprus.png', 35, 33, '塞浦路斯');      
            addLabel('nations/belgie.png', 50.5, 4.5, '比利时');   
            addLabel('nations/latvija.png', 56.9, 24.6, '拉脱维亚'); 
            addLabel('nations/åland.png', 60.2, 20, '奥兰群岛');     
            addLabel('nations/australia.png', -25, 133, '澳大利亚');
            addLabel('nations/thailand.png', 15, 100, '泰国');
            addLabel('nations/guernsey.png', 49, -2, '根西岛');

            window.addEventListener('resize', onWindowResize);
        }

        function addLabel(imageSrc, lat, lon, zhName) {
            const div = document.createElement('div');
            div.className = 'city-label';

            const img = document.createElement('img');
            img.src = imageSrc; 
            div.appendChild(img);

            if (zhName) {
                const span = document.createElement('span');
                span.className = 'zh-name';
                span.innerText = zhName;
                div.appendChild(span);
            }

            const labelObject = new THREE.CSS2DObject(div);

            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            
            const r = sphereRadius + 1; 
            
            labelObject.position.x = -(r * Math.sin(phi) * Math.cos(theta));
            labelObject.position.z = (r * Math.sin(phi) * Math.sin(theta));
            labelObject.position.y = (r * Math.cos(phi));

            sphere.add(labelObject); 
        }

        function changeTheme(textureUrl, btnElement) {
            const newTexture = textureLoader.load(textureUrl);
            sphere.material.map = newTexture;
            sphere.material.needsUpdate = true;

            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
    </script>
</body>
</html>
