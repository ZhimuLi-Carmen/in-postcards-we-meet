<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明信片展示的图像</title>
<style>
    @font-face {
        font-family: 'CachetForWeb';
        src: url('../assets/fonts/Cachetforweb-Regular.woff2') format('woff2'); 
        font-weight: normal;
        font-style: normal;
    }

    :root {
        --card-size: 40px; 
    }

    body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #fff; 
        font-family: 'CachetForWeb', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-variant-ligatures: contextual;
        font-feature-settings: "calt" 1;
    }

    #desk {
        width: 100%;
        height: 100%;
        position: relative;
    }

    .postcard {
        position: absolute;
        cursor: grab;
        user-select: none;      
        touch-action: none;     
        
        max-width: var(--card-size);       
        max-height: var(--card-size);      
        
        padding: 0px;
        background-color: white; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        pointer-events: auto; 
        transform: rotate(0deg); 
    }

    .postcard:active {
        cursor: grabbing;
    }

    .postcard.zoomed {
        z-index: 99999 !important; 
        transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                    top 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                    transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                    box-shadow 0.5s ease !important;
        box-shadow: 0 20px 60px rgba(0,0,0,0.2) !important;
        cursor: zoom-out !important; 
    }

    #zoom-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(255, 255, 255, 0.85); 
        z-index: 99998; 
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
    }

    #zoom-overlay.active {
        opacity: 1;
        pointer-events: auto; 
    }

    .title-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 8rem;
        font-weight: 200;
        letter-spacing: -2px;
        color: black; 
        pointer-events: none; /* 💡 保持完全穿透，不阻挡底层卡片交互 */
        z-index: 10000;
        text-align: center;
        text-transform: none;
    }

    #sidebar {
        position: absolute;
        left: 40px; 
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 5px; 
        z-index: 10002; 
        align-items: flex-start;
    }

    .theme-btn {
        background: transparent;
        color: rgba(0, 0, 0, 0.4); 
        border: none;
        padding: 8px 0;
        cursor: pointer;
        font-family: inherit; 
        font-size: 30px;
        text-align: left;
        text-transform: lowercase; 
        letter-spacing: 0.5px;
        transition: color 0.15s ease, padding-left 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); 
        position: relative;
        outline: none;
    }

    .theme-btn:hover {
        color: rgba(0, 0, 0, 0.8);
    }

    .theme-btn.active {
        color: #000; 
        padding-left: 15px; 
    }

    .theme-btn.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 8px;
        height: 1px;
        background-color: #000;
    }

    #controls {
        position: absolute;
        bottom: 40px; 
        left: 50%;
        transform: translateX(-50%);       
        z-index: 10001; 
        display: flex;
        align-items: center;
        gap: 15px;
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 0;
    }

    #controls label {
        font-family: inherit;
        font-size: 20px;
        font-weight: normal; 
        color: #000;
        white-space: nowrap;
        text-transform: lowercase; 
        letter-spacing: 0.5px;
    }

    #sizeValue {
        opacity: 0.5; 
        margin-left: 5px;
    }

    #sizeSlider {
        -webkit-appearance: none;
        appearance: none;
        width: 150px;
        background: transparent;
        cursor: pointer;
        outline: none;
    }

    #sizeSlider::-webkit-slider-runnable-track {
        width: 100%; height: 1px; background: #000; border: none;
    }
    #sizeSlider::-moz-range-track {
        width: 100%; height: 1px; background: #000; border: none;
    }
    #sizeSlider::-webkit-slider-thumb {
        -webkit-appearance: none; height: 12px; width: 2px;
        background: #000; margin-top: -5px; border-radius: 0; transition: transform 0.1s ease;
    }
    #sizeSlider::-moz-range-thumb {
        height: 12px; width: 2px; background: #000; border: none;
        border-radius: 0; transition: transform 0.1s ease;
    }
    #sizeSlider:hover::-webkit-slider-thumb { transform: scaleX(4); }
    #sizeSlider:hover::-moz-range-thumb { transform: scaleX(4); }

    /* =========================================
       中文悬浮提示样式模板
    ========================================= */

    /* 1. 侧边栏按钮的中文悬浮 */
    .theme-btn .zh-name {
        display: none;                
        position: absolute;           
        left: 50%;                    
        transform: translateX(-50%);  
        top: 45px;                   
        color: #000;  /* 💡 修改：改为纯黑 */                 
        font-size: 14px;              
        white-space: nowrap;          
        text-shadow: none; /* 💡 修改：移除阴影 */
        pointer-events: none;         
        text-transform: none;         
    }

    .theme-btn:hover .zh-name {
        display: block;
    }

    /* 2. 中心文本交互层：彻底移除鼠标拦截 */
    .title-overlay .text-trigger {
        pointer-events: none; /* 💡 修改：恢复为 none，让它背后的卡片完全可点 */
    }

    /* 3. 中心文本的中文悬浮 */
    .title-overlay .zh-name {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); 
        color: #000;       /* 💡 修改：改为纯黑 */
        font-size: 14px;
        line-height: 1.6; 
        white-space: nowrap;
        text-shadow: none; /* 💡 修改：移除阴影 */
        pointer-events: none;
        text-transform: none;
        letter-spacing: 1px;
        font-weight: normal;
    }

    /* 💡 修改：配合下方的 JS，通过添加 hover-active 类名来显示中文 */
    .title-overlay.hover-active .zh-name {
        display: block;
    }
</style>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="title-overlay">
        <span class="text-trigger">greetings<br>from</span>
        <span class="zh-name">双击图像可放大<br>鼠标可随意拖动摆放图像</span>
    </div>
    
    <div id="zoom-overlay"></div>
    
    <div id="desk"></div>

    <div id="sidebar">
        <button class="theme-btn active" onclick="switchLayout('river', this)">river<span class="zh-name">河流</span></button>
        <button class="theme-btn" onclick="switchLayout('stack', this)">stack<span class="zh-name">堆叠</span></button>
    </div>

    <div id="controls">
        <label for="sizeSlider">size: <span id="sizeValue">40px</span></label>
        <input type="range" id="sizeSlider" min="15" max="70" value="40">
    </div>

<script src="../js/postcardsdata.js"></script>
<script src="../js/nav.js"></script>
 <script src="../js/screensaver.js"></script>

<script>
    const desk = document.getElementById('desk');
    const zoomOverlay = document.getElementById('zoom-overlay');
    const TOTAL_CARDS = 711;
    const MAX_POSSIBLE_SIZE = 70; 
    let topZIndex = TOTAL_CARDS; 

    // 缩放状态管理
    let zoomedCard = null;
    let originalCardState = {};

    const imageUrls = Array.from({length: TOTAL_CARDS}, (_, i) => 
        `../assets/images_thumb/card${i + 1}.JPG` 
    );

    function initPostcards() {
        const fragment = document.createDocumentFragment();

        imageUrls.forEach((url, index) => {
            const img = document.createElement('img');
            img.src = url;
            img.className = 'postcard';
            img.draggable = false; 

            img.onerror = function() {
                this.style.width = '10px';
                this.style.height = '10px';
                this.style.backgroundColor = '#ccc';
            };

            img.style.zIndex = Math.floor(Math.random() * TOTAL_CARDS); 
            img.dataset.baseRotation = 0; 

            // 绑定双击事件
            img.addEventListener('dblclick', handleDoubleClick);
            // 放大的图片自身也能点击缩小
            img.addEventListener('click', (e) => {
                if (img.classList.contains('zoomed')) {
                    closeZoom();
                }
            });

            makeDraggable(img);
            fragment.appendChild(img);
        });

        desk.appendChild(fragment);

        setTimeout(() => {
            const defaultBtn = document.querySelector('.theme-btn.active');
            switchLayout('river', defaultBtn);
        }, 100);
    }

    // 处理双击放大
    function handleDoubleClick(e) {
        e.stopPropagation();
        const img = e.target;

        if (zoomedCard === img) return; 
        if (zoomedCard) closeZoom(); 

        zoomedCard = img;
        
        originalCardState = {
            left: img.style.left,
            top: img.style.top,
            transform: img.style.transform,
            zIndex: img.style.zIndex
        };

        const currentSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-size'));
        
        const centerX = window.innerWidth / 2 - currentSize / 2;
        const centerY = window.innerHeight / 2 - currentSize / 2;

        const scaleTarget = (window.innerHeight * 0.65) / currentSize; 

        img.classList.add('zoomed');
        img.style.left = `${centerX}px`;
        img.style.top = `${centerY}px`;
        img.style.transform = `scale(${scaleTarget}) rotate(0deg)`;

        zoomOverlay.classList.add('active');
    }

    // 处理缩小还原
    function closeZoom() {
        if (!zoomedCard) return;

        zoomedCard.style.left = originalCardState.left;
        zoomedCard.style.top = originalCardState.top;
        
        const baseRot = parseFloat(zoomedCard.dataset.baseRotation) || 0;
        zoomedCard.style.transform = `scale(1) rotate(${baseRot}deg)`;
        
        const cardToReset = zoomedCard;
        const origZ = originalCardState.zIndex;
        
        setTimeout(() => {
            cardToReset.classList.remove('zoomed');
            cardToReset.style.zIndex = origZ;
        }, 500); 

        zoomOverlay.classList.remove('active');
        zoomedCard = null;
    }

    zoomOverlay.addEventListener('click', closeZoom);

    function switchLayout(mode, btnElement) {
        if (zoomedCard) closeZoom();

        const buttons = document.querySelectorAll('.theme-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        const cards = document.querySelectorAll('.postcard');
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        
        const currentSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-size')) || 40;
        const safeWidth = screenWidth - currentSize;
        const safeHeight = screenHeight - currentSize;

        const mainFreq = 3; 
        const detailFreq = 5; 
        const phaseShift = Math.PI * 0.9; 
        const detailPhaseShift = Math.PI;
        const waveAmplitude = screenHeight * 0.25; 
        const irregularAmplitude = screenHeight * 0.05;

        cards.forEach((img, index) => {
            img.style.transition = 'left 0.8s cubic-bezier(0.25, 1, 0.5, 1), top 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.15s ease';

            if (mode === 'river') {
                let randomX = (Math.random() > 0.1) ? (Math.random() * 0.8 + 0.1) * safeWidth : Math.random() * safeWidth;
                const normalizedX = randomX / safeWidth; 
                let baseY;
                const isLineOne = index % 2 === 0; 

                if (isLineOne) {
                    baseY = (screenHeight / 2) + (Math.sin(normalizedX * Math.PI * mainFreq) * waveAmplitude) + (Math.cos(normalizedX * Math.PI * detailFreq) * irregularAmplitude);
                } else {
                    baseY = (screenHeight / 2) + (Math.sin(normalizedX * Math.PI * mainFreq + phaseShift) * waveAmplitude) + (Math.cos(normalizedX * Math.PI * detailFreq + detailPhaseShift) * irregularAmplitude); 
                }

                const densityRoll = Math.random();
                let yOffset = (densityRoll < 0.4) ? (Math.random() - 0.5) * 120 
                            : (densityRoll < 0.8) ? (Math.random() - 0.5) * 300 
                            : (Math.random() - 0.5) * 700; 

                let finalY = Math.max(0, Math.min(baseY + yOffset, safeHeight));

                img.style.left = `${randomX}px`;
                img.style.top = `${finalY}px`;
                img.dataset.baseRotation = 0; 
                img.style.transform = `rotate(0deg) scale(1)`;

            } else if (mode === 'stack') {
                const randomX = (screenWidth / 2 - currentSize/2) + (Math.random() - 0.5) * (screenWidth * 0.6); 
                const randomY = (screenHeight / 2 - currentSize/2) + (Math.random() - 0.5) * (screenHeight * 0.6);
                const randomRotation = (Math.random() - 0.5) * 60; 

                img.style.left = `${randomX}px`;
                img.style.top = `${randomY}px`;
                img.dataset.baseRotation = randomRotation; 
                img.style.transform = `rotate(${randomRotation}deg) scale(1)`;
            }

            setTimeout(() => {
                if (!img.classList.contains('zoomed')) {
                    img.style.transition = 'transform 0.15s ease, box-shadow 0.15s ease';
                }
            }, 850); 
        });
    }

    function makeDraggable(element) {
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        element.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return; 
            if (element.classList.contains('zoomed')) return;

            isDragging = true;
            element.setPointerCapture(e.pointerId);
            topZIndex++;
            element.style.zIndex = topZIndex;

            startX = e.clientX;
            startY = e.clientY;
            initialLeft = element.offsetLeft;
            initialTop = element.offsetTop;

            const baseRot = parseFloat(element.dataset.baseRotation) || 0;
            element.style.transform = `scale(1.1) rotate(${baseRot}deg)`;
            element.style.boxShadow = "2px 8px 15px rgba(0,0,0,0.3)";
        });

        element.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            let newX = initialLeft + dx;
            let newY = initialTop + dy;

            const currentSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-size'));
            const maxX = window.innerWidth - currentSize;
            const maxY = window.innerHeight - currentSize;

            element.style.left = `${Math.max(0, Math.min(newX, maxX))}px`;
            element.style.top = `${Math.max(0, Math.min(newY, maxY))}px`;
        });

        element.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            element.releasePointerCapture(e.pointerId);
            
            if (!element.classList.contains('zoomed')) {
                const baseRot = parseFloat(element.dataset.baseRotation) || 0;
                element.style.transform = `scale(1) rotate(${baseRot}deg)`;
                element.style.boxShadow = "0 2px 5px rgba(0,0,0,0.15)";
            }
        });

        element.addEventListener('pointercancel', (e) => {
            isDragging = false;
            if (!element.classList.contains('zoomed')) {
                const baseRot = parseFloat(element.dataset.baseRotation) || 0;
                element.style.transform = `scale(1) rotate(${baseRot}deg)`;
            }
        });
    }

    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    let currentCardSize = parseInt(sizeSlider.value); 

    sizeSlider.addEventListener('input', (e) => {
        if (zoomedCard) closeZoom();

        const newSize = parseInt(e.target.value);
        const offset = (newSize - currentCardSize) / 2; 

        sizeValue.textContent = newSize + 'px';
        document.documentElement.style.setProperty('--card-size', newSize + 'px');

        const cards = document.querySelectorAll('.postcard');
        const maxX = window.innerWidth - newSize;
        const maxY = window.innerHeight - newSize;

        cards.forEach(card => {
            let currentLeft = parseFloat(card.style.left) - offset;
            let currentTop = parseFloat(card.style.top) - offset;
            card.style.left = `${Math.max(0, Math.min(currentLeft, maxX))}px`;
            card.style.top = `${Math.max(0, Math.min(currentTop, maxY))}px`;
        });
        
        currentCardSize = newSize; 
    });

    // ==========================================
    // 💡 新增：中心文本的无遮挡 hover 追踪逻辑
    // ==========================================
    const overlayLayer = document.querySelector('.title-overlay');
    const textTriggerBox = document.querySelector('.text-trigger');

    document.addEventListener('pointermove', (e) => {
        // 实时获取“greetings from”文字的实际边缘边界
        const rect = textTriggerBox.getBoundingClientRect();
        
        // 默默判断鼠标是否进入了文字的矩形范围内
        if (e.clientX >= rect.left && e.clientX <= rect.right &&
            e.clientY >= rect.top && e.clientY <= rect.bottom) {
            overlayLayer.classList.add('hover-active'); // 显示中文
        } else {
            overlayLayer.classList.remove('hover-active'); // 隐藏中文
        }
    });

    window.onload = initPostcards;
</script>
</body>
</html>
