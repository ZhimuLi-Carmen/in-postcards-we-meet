<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明信片写着的文字</title>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        /* =========================================
           全局字体与样式
        ========================================= */
        @font-face {
            font-family: 'Cachet';
            src: url('../assets/fonts/Cachetforweb-Regular.woff2') format('woff2'); 
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #f4f4f4; 
        }

        .cachet-font { font-family: 'Cachet', sans-serif; }

        /* =========================================
           瑞士极简侧边栏
        ========================================= */
        .swiss-sidebar { position: fixed; left: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 10000; align-items: flex-start; }
        .nav-item { background: transparent; color: rgba(0, 0, 0, 0.3); border: none; padding: 8px 0; cursor: pointer; font-family: 'Cachet', sans-serif; font-size: 30px; text-align: left; text-transform: lowercase; transition: color 0.2s ease, padding-left 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94); position: relative; outline: none; }
        .nav-item.active { color: #000; padding-left: 15px; }
        .nav-item.active::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 8px; height: 1px; background-color: #000; }

        .nav-item .zh-name {
            display: none;
            position: absolute;
            top: 45px; 
            left: 50%;                    
            transform: translateX(-50%);  
            margin-top: 4px;              
            color: #000;
            font-size: 14px;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
            font-weight: normal;
            white-space: nowrap;
            text-transform: none; 
            pointer-events: none;
            letter-spacing: 1px;
        }

        .nav-item.active .zh-name {
            transform: translateX(calc(-50% + 7.5px)); 
        }

        .nav-item:hover .zh-name {
            display: block;
        }

        /* =========================================
           核心容器
        ========================================= */
        .page-wrapper { display: none; width: 100vw; height: 100vh; }
        
        #page-linear.active { 
            display: flex; 
            background-color: #f4f4f4; 
            overflow-x: auto; 
            overflow-y: hidden;
        }
        #page-linear::-webkit-scrollbar { display: none; }
        #page-linear { scrollbar-width: none; -ms-overflow-style: none; }

        #page-matrix.active { display: flex; flex-direction: column; background-color: #f6f6f6; }
        #page-overlap.active { display: block; overflow-y: auto; overflow-x: hidden; padding: 40px 40px 40px 140px; background-color: #fff; }

        /* =========================================
           Linear 图片弹窗样式 (新增)
        ========================================= */
       /* =========================================
           Linear 图片弹窗样式
        ========================================= */
        #linear-image-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: transparent; /* 1. 去掉遮罩层本身的白色/灰色背景 */
            display: none; justify-content: center; align-items: center;
            z-index: 20000; cursor: pointer;
            opacity: 0; transition: opacity 0.3s ease;
        }
        #linear-image-overlay.show {
            display: flex; opacity: 1;
        }
        #linear-image-overlay img {
            /* 2. 放大图片：将 75vw/vh 调整为 90vw/vh（你也可以改成 100vw 让它撑满屏幕） */
            max-width: 90vw; max-height: 90vh; 
            
            /* 3. 已删除原有的 box-shadow 投影 */
            
            /* 4. 关键：利用正片叠底消除 JPG 图片的白色矩形边界，让画面内容直接溶于页面 */
            mix-blend-mode: multiply; 
            
            pointer-events: none; 
        }

        /* =========================================
           Linear 独立样式
        ========================================= */
        #center-container {
            margin: auto; 
            flex-shrink: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 0 10vw; 
            z-index: 10;
        }

        #editable-text {
            font-size: 15vw; line-height: 1; letter-spacing: 0; outline: none; white-space: nowrap; cursor: text; font-family: 'Cachet', sans-serif; color: #111; font-feature-settings: "lock" 1, "liga" 1, "calt" 0; text-rendering: geometricPrecision; -webkit-font-smoothing: antialiased;
        }

        #editable-text::selection { background: #111; color: #f4f4f4; }

        /* =========================================
           Matrix 独立样式
        ========================================= */
        #page-matrix { --line-color: #d8d8d8; --ui-color: #888888; --accent-color: #000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #111; }
        .main-container { flex: 1; display: flex; width: 100%; overflow: hidden; padding-left: 140px; }
        .column { flex: 1 1 33.33%; display: flex; flex-direction: column; overflow-y: auto; position: relative; min-width: 150px; container-type: inline-size; }
        
        .column-header { 
            position: sticky; top: 0; background: #f6f6f6; padding: 25px 10px; 
            border-bottom: 1px solid var(--line-color); 
            font-family: 'Cachet', sans-serif; font-size: 26px; color: #111; 
            text-transform: lowercase; text-align: center; z-index: 5; 
        }

        .resizer { width: 4px; margin: 0 -2px; background-color: transparent; cursor: col-resize; position: relative; z-index: 10; }
        .resizer::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background-color: var(--line-color); transition: background-color 0.2s, width 0.2s; transform: translateX(-50%); }
        .resizer:hover::after, .resizer.dragging::after { background-color: var(--accent-color); width: 2px; }
        .glyph-matrix { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .glyph-matrix td { padding: 4vh 0; font-size: 13cqw; text-align: center; border-bottom: 1px solid var(--line-color); word-break: break-all; }
        .glyph-matrix tr:hover td { background: rgba(0,0,0,0.03); }
        .set-base { font-feature-settings: "liga" 1, "calt" 1; }
        .set-01 { font-feature-settings: "ss01" 1, "liga" 1, "calt" 1; }
        .set-02 { font-feature-settings: "ss02" 1, "liga" 1, "calt" 1; }
        .set-03 { font-feature-settings: "ss03" 1, "liga" 1, "calt" 1; }
        .set-04 { font-feature-settings: "ss04" 1, "liga" 1, "calt" 1; }
        .column::-webkit-scrollbar { width: 0px; background: transparent; }
        body.is-dragging { user-select: none; cursor: col-resize; }

        /* =========================================
           Overlap 独立样式
        ========================================= */
        #page-overlap { font-family: 'Cachet', sans-serif; }
        #grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(10vw, 1fr)); gap: 4vw; max-width: 1400px; margin: 0 auto; transition: opacity 0.4s; }
        .dimmed #grid-container { opacity: 0.1; pointer-events: none; }
        .letter-stack { position: relative; height: 12vw; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .letter-stack:hover { transform: scale(1.1); }
        .layer { position: absolute; font-size: 8vw; color: transparent; -webkit-text-stroke: 1px #111; white-space: pre; pointer-events: none; transition: opacity 0.3s ease; }
        
        .v-0 { font-feature-settings: "liga" 1, "calt" 1; }
        .v-1 { font-feature-settings: "ss01" 1, "liga" 1, "calt" 1; }
        .v-2 { font-feature-settings: "ss02" 1, "liga" 1, "calt" 1; }
        .v-3 { font-feature-settings: "ss03" 1, "liga" 1, "calt" 1; }
        .v-4 { font-feature-settings: "ss04" 1, "liga" 1, "calt" 1; }

        #lab-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 255, 255, 0.98); display: none; justify-content: center; align-items: center; z-index: 1000; }
        #lab-display { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
        .big-layer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30vw; line-height: 1; text-align: center; color: transparent; -webkit-text-stroke: 2px #000; opacity: 1; transition: opacity 0.4s ease; }
        .nav-label { position: absolute; width: 45px; height: 45px; border: 1px solid #000; display: flex; justify-content: center; align-items: center; cursor: pointer; background: white; z-index: 1010; border-radius: 50%; font-family: 'Cachet', sans-serif; font-size: 20px; font-feature-settings: "liga" 0, "calt" 0; --base-transform: translate(-50%, -50%); transform: var(--base-transform) scale(1); transition: all 0.2s cubic-bezier(0.19, 1, 0.22, 1); pointer-events: auto; }
        .nav-label:hover { background: #eee; transform: var(--base-transform) scale(1.15); }
        .nav-label.active { background: #000; color: #fff; transform: var(--base-transform) scale(1.15); border-color: #000; }
        
        /* 💡 优化：Overlap 顶部的 UI 面板样式 */
        .lab-ui { 
            position: absolute; top: 40px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 40px 0 160px; 
            box-sizing: border-box; font-size: 22px; /* 放大一点适配 Cachet 字体 */
            font-family: 'Cachet', sans-serif; /* 改为 Cachet */
            text-transform: none; /* 移除全大写 */
            letter-spacing: 0.5px; z-index: 1020; 
        }
        #reset-btn { cursor: pointer; text-decoration: none; } /* 移除下划线 */
        #close-btn { cursor: pointer; }

        /* =========================================
           悬浮作者信息小方块 (Norm 极简风)
        ========================================= */
        #author-tooltip {
            position: fixed;
            pointer-events: none; 
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 20000;
            display: flex;
            flex-direction: column;
            align-items: center; 
        }
        
        .tooltip-en-box {
            background-color: #000;
            color: #fff;
            padding: 8px 14px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 0.05em;
            white-space: nowrap;
            border-radius: 2px;
            display: inline-block;
        }

        .cachet-name {
            font-family: 'Cachet', sans-serif;
            font-size: 16px; 
            line-height: 1;
            font-weight: normal;
            vertical-align: baseline;
        }

        .tooltip-zh-box {
            display: block;
            margin-top: 6px;     
            color: #000;         
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
            font-size: 13px;
            font-weight: normal;
            letter-spacing: 1px;
            text-transform: none;
            white-space: nowrap;
        }

        /* =========================================
           无缝飞行引擎专用图层
        ========================================= */
        #flight-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
        .flight-char {
            position: absolute; transform: translate(-50%, -50%); color: #111; white-space: pre;
            transition: left 0.8s cubic-bezier(0.25, 1, 0.35, 1), 
                        top 0.8s cubic-bezier(0.25, 1, 0.35, 1), 
                        font-size 0.8s cubic-bezier(0.25, 1, 0.35, 1), 
                        opacity 0.6s ease;
        }
        .invisible-target, .invisible-target * { color: transparent !important; text-shadow: none !important; -webkit-text-stroke: transparent !important; }

        /* =========================================
           💡 优化：Matrix 页面拖拽提示与表头中文悬浮
        ========================================= */
        .resizer::before {
            content: "◀ \00a0 \00a0 ▶"; /* 使用不换行空格将三角形拉开，保证绝对对称 */
            position: absolute;
            top: 40px; 
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: #000;
            pointer-events: none;
            z-index: 20;
            width: max-content;
            letter-spacing: normal; /* 恢复 normal 避免右侧多出隐形宽度 */
        }

        /* 统一使用此父类实现内部 .zh-name 的完美悬浮居中 */
        .header-word {
            position: relative;
            cursor: default;
            display: inline-block;
        }
        
        .header-word .zh-name {
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 4px;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
            font-size: 14px;
            color: #000;
            white-space: nowrap;
            text-transform: none; 
            letter-spacing: 1px;
            font-weight: normal;
        }

        .header-word:hover .zh-name {
            display: block;
        }

        .scroll-hint {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            text-align: center;
            padding-top: 10px;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
            font-size: 14px;
            color: #000;
            pointer-events: none;
            opacity: 0; 
            font-weight: normal;
            letter-spacing: 1px;
            z-index: 10;
            text-transform: none;
        }
        
        .column:has(.glyph-matrix tr:hover) .scroll-hint {
            opacity: 1;
        }

        /* =========================================
           Overlap 页面悬浮提示
        ========================================= */
        .letter-stack::after {
            content: "双击查看字形";
            display: none;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
            font-size: 14px;
            color: #000;
            white-space: nowrap;
            pointer-events: none;
            z-index: 100;
            font-weight: normal;
        }
        .letter-stack:hover::after {
            display: block;
        }
    </style>
</head>

    <div id="flight-layer"></div>

        <div class="main-container" id="container">
            <div class="column" id="col-upper">

            <div class="column" id="col-lower">

                    <span class="header-word">Lowercase<span class="zh-name">小写</span></span>
                    <div class="scroll-hint">▼ 下滑查看更多字符</div>
                </div>
                <table class="glyph-matrix"><tbody id="body-lower"></tbody></table>
            </div>
            <div class="resizer" id="resizer-2"></div>
            <div class="column" id="col-symbols">
                <div class="column-header">
                    <span class="header-word">Symbols<span class="zh-name">符号</span></span>
                    <div class="scroll-hint">▼ 下滑查看更多字符</div>
                </div>
                <table class="glyph-matrix"><tbody id="body-symbols"></tbody></table>
            </div>
        </div>
    </div>

    <div id="page-overlap" class="page-wrapper">
        <div id="grid-container"></div>
        <div id="lab-overlay">
            <div class="lab-ui">
                <div id="reset-btn" class="header-word">Show All Scribble<span class="zh-name">显示所有字形</span></div>
                <div id="close-btn" class="header-word">✕ close<span class="zh-name">关闭</span></div>
            </div>
            <div id="lab-display"></div>
        </div>
    </div>

        function focusLinearText() {

        function makeResizable(resizer, leftCol, rightCol) {
            let startX = 0, leftStartWidth = 0, rightStartWidth = 0;
            const onMouseDown = function(e) {
                startX = e.clientX; leftStartWidth = leftCol.getBoundingClientRect().width; rightStartWidth = rightCol.getBoundingClientRect().width;
                leftCol.style.flex = 'none'; rightCol.style.flex = 'none'; leftCol.style.width = leftStartWidth + 'px'; rightCol.style.width = rightStartWidth + 'px';
                resizer.classList.add('dragging'); document.body.classList.add('is-dragging');
                document.addEventListener('mousemove', onMouseMove); document.addEventListener('mouseup', onMouseUp);
            };
            const onMouseMove = function(e) {
                const dx = e.clientX - startX; const newLeftWidth = leftStartWidth + dx; const newRightWidth = rightStartWidth - dx;
                if (newLeftWidth > 150 && newRightWidth > 150) { leftCol.style.width = newLeftWidth + 'px'; rightCol.style.width = newRightWidth + 'px'; }
            };
            const onMouseUp = function() {
                resizer.classList.remove('dragging'); document.body.classList.remove('is-dragging');
                document.removeEventListener('mousemove', onMouseMove); document.removeEventListener('mouseup', onMouseUp);
            };
            resizer.addEventListener('mousedown', onMouseDown);
        }

        function seededRandom(seed) {
            return function() {
                seed = Math.imul(seed ^ seed >>> 15, seed | 1);
                seed ^= seed + Math.imul(seed ^ seed >>> 7, seed | 61);
                return ((seed ^ seed >>> 14) >>> 0) / 4294967296;
            }
        }

            overlayLab.style.display = 'flex';
            displayLab.innerHTML = ''; 

            for(let i=0; i<5; i++) {
                const s = document.createElement('div');
                s.className = `big-layer v-${i} layer-id-${i}`;
                s.textContent = char;
                s.style.pointerEvents = 'none'; 
                displayLab.appendChild(s);
            }

            setTimeout(() => {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                document.querySelectorAll('.big-layer').forEach(layer => {
                    const rect = layer.getBoundingClientRect();
                    if(rect.left < minX) minX = rect.left; if(rect.top < minY) minY = rect.top;
                    if(rect.right > maxX) maxX = rect.right; if(rect.bottom > maxY) maxY = rect.bottom;
                });

                const cx = (maxX + minX) / 2; const cy = (maxY + minY) / 2;
                const baseRx = (maxX - minX) / 2 + 45; const baseRy = (maxY - minY) / 2 + 45;
                const rand = seededRandom(char.charCodeAt(0));

                for(let i = 0; i < 5; i++) {
                    const btn = document.createElement('div');
                    btn.className = 'nav-label'; btn.textContent = i + 1; btn.dataset.idx = i;
                    const sectorStart = i * 72; const jitter = 15 + rand() * 42; 
                    const angle = (sectorStart + jitter) * Math.PI / 180;
                    const pushOutward = i * 8; 
                    const x = cx + Math.cos(angle) * (baseRx + pushOutward);
                    const y = cy + Math.sin(angle) * (baseRy + pushOutward);
                    
                    btn.style.left = `${x}px`; btn.style.top = `${y}px`;

                        const idx = parseInt(btn.dataset.idx);

                                l.style.pointerEvents = "auto"; 
                            } else {
                                l.style.opacity = "0";
                                l.style.pointerEvents = "none";
                            }
                        });
                    };
                    displayLab.appendChild(btn);
                }
            }, 50);
        }

                    }

                    if (range && range.startContainer.nodeType === Node.TEXT_NODE) {
                        const textNode = range.startContainer;

                        if (text && text.length > 0) {

        /* =========================================

        function extractPositions(mode) {
            const positions = [];
            
            if (mode === 'linear') {
                const regex = /\S/; 
                const el = document.getElementById('editable-text');
                const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
                let textNode;
                while (textNode = walker.nextNode()) {
                    const text = textNode.nodeValue;
                    for (let i = 0; i < text.length; i++) {
                        if (regex.test(text[i])) {
                            const range = document.createRange();
                            range.setStart(textNode, i); range.setEnd(textNode, i + 1);
                            const rect = range.getBoundingClientRect();
                            positions.push({
                                char: text[i], cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2,
                                fontSize: window.getComputedStyle(el).fontSize
                            });
                        }
                    }
                }
            } else if (mode === 'matrix') {
                const regex = /[a-zA-Z]/; 
                document.querySelectorAll('#page-matrix .set-base').forEach(cell => {
                    const char = cell.textContent.trim();
                    if (regex.test(char) && char.length === 1) {
                        const rect = cell.getBoundingClientRect();
                        positions.push({
                            char: char, cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2,
                            fontSize: window.getComputedStyle(cell).fontSize, el: cell
                        });
                    }
                });
            } else if (mode === 'overlap') {
                const regex = /[a-zA-Z]/; 
                document.querySelectorAll('#page-overlap .letter-stack').forEach(stack => {
                    const baseLayer = stack.querySelector('.v-0');
                    if(baseLayer) {
                        const char = baseLayer.textContent.trim();
                        if (regex.test(char) && char.length === 1) {
                            const rect = stack.getBoundingClientRect(); 
                            positions.push({
                                char: char, cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2,
                                fontSize: window.getComputedStyle(baseLayer).fontSize, el: stack 
                            });
                        }
                    }
                });
            }
            return positions;
        }

        let isAnimating = false;

        function switchPage(targetMode, btn) {
            if (isAnimating) return;
            const pages = ['linear', 'matrix', 'overlap'];
            const currentMode = pages.find(p => document.getElementById('page-' + p).classList.contains('active'));
            
            if (targetMode === currentMode) return;
            isAnimating = true;

            if(overlayLab.style.display === 'flex') closeLab();

            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const startPos = extractPositions(currentMode);

            document.getElementById('page-' + currentMode).classList.remove('active');
            const targetPage = document.getElementById('page-' + targetMode);
            targetPage.classList.add('active');

            if (targetMode === 'linear') {
                centerLinearPage();
                focusLinearText(); // 💡 切换到 linear 时，也自动召唤真实光标
            }

            const endPos = extractPositions(targetMode);
            
            const flyingGhosts = [];
            const fadingOutGhosts = [];
            const fadingInGhosts = [];
            
            const targetedEnds = new Set();
            const targetedStarts = new Set();

            startPos.forEach(s => {
                let matches = endPos.filter(e => e.char === s.char); 
                if (matches.length > 0) {
                    matches.forEach(e => { flyingGhosts.push({ start: s, end: e }); targetedEnds.add(e); });
                    targetedStarts.add(s);
                } else {
                    if (currentMode === 'linear') { fadingOutGhosts.push({ start: s }); }
                }
            });

            endPos.forEach(e => {
                if (!targetedEnds.has(e)) {
                    if (targetMode === 'linear') { fadingInGhosts.push({ end: e }); }
                }
            });

            const layer = document.getElementById('flight-layer');
            layer.innerHTML = '';
            const allGhostElements = [];

            flyingGhosts.forEach(g => {
                const ghost = document.createElement('div');
                ghost.className = 'flight-char cachet-font';
                ghost.textContent = g.start.char;
                ghost.style.left = g.start.cx + 'px'; ghost.style.top = g.start.cy + 'px'; ghost.style.fontSize = g.start.fontSize;
                layer.appendChild(ghost);
                allGhostElements.push({ el: ghost, targetX: g.end.cx, targetY: g.end.cy, targetSize: g.end.fontSize, targetOpacity: 1 });
            });

            fadingOutGhosts.forEach(g => {
                const ghost = document.createElement('div');
                ghost.className = 'flight-char cachet-font';
                ghost.textContent = g.start.char;
                ghost.style.left = g.start.cx + 'px'; ghost.style.top = g.start.cy + 'px'; ghost.style.fontSize = g.start.fontSize;
                layer.appendChild(ghost);
                allGhostElements.push({ el: ghost, targetX: g.start.cx, targetY: g.start.cy, targetSize: g.start.fontSize, targetOpacity: 0 });
            });

            fadingInGhosts.forEach(g => {
                const ghost = document.createElement('div');
                ghost.className = 'flight-char cachet-font';
                ghost.textContent = g.end.char;
                ghost.style.left = g.end.cx + 'px'; ghost.style.top = g.end.cy + 'px'; ghost.style.fontSize = g.end.fontSize;
                ghost.style.opacity = '0'; 
                layer.appendChild(ghost);
                allGhostElements.push({ el: ghost, targetX: g.end.cx, targetY: g.end.cy, targetSize: g.end.fontSize, targetOpacity: 1 });
            });

            if (targetMode === 'matrix' || targetMode === 'overlap') {
                Array.from(targetedEnds).forEach(e => { if (e.el) e.el.classList.add('invisible-target'); });
            } else {
                document.getElementById('editable-text').classList.add('invisible-target');
            }

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    allGhostElements.forEach(g => {
                        g.el.style.left = g.targetX + 'px';
                        g.el.style.top = g.targetY + 'px';
                        g.el.style.fontSize = g.targetSize;
                        g.el.style.opacity = g.targetOpacity;
                    });
                });
            });

            setTimeout(() => {
                layer.innerHTML = '';
                document.querySelectorAll('.invisible-target').forEach(el => el.classList.remove('invisible-target'));
                isAnimating = false;
            }, 850);
        }
    </script>
</body>
</html>
